[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parousia-guard"
version = "0.2.0"
description = "Agentic Mail Server Guard — Postfix pipe-to-agent gateway with rate limiting and temporal presence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MR-Krabs", email = "team@pairadmin.dev"}]
dependencies = [
    "bcrypt>=4.0.0",
    "click>=8.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "redis>=5.0",
    "mcp>=1.0.0,<2.0.0",
    "starlette>=0.27",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "icalendar>=5.0",
    "python-dateutil>=2.8",
    "dkimpy>=1.1.0",
    "cryptography>=41.0",
    # Mem0 presence memory (4th domain): recorder + Qdrant client.
    # fastembed is mem0's optional local-ONNX embedder (its default here),
    # so it is pinned directly rather than relying on mem0ai's extras.
    "mem0ai>=2.0.7,<3.0",
    "qdrant-client>=1.9,<2.0",
    "fastembed>=0.3,<1.0",
    # MP-8: server-side RFC 6238 TOTP generation for app-based 2FA.
    "pyotp>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
    "fakeredis>=2.20",
    "httpx>=0.27.0",
]
postgres = [
    "psycopg2-binary>=2.9",
]

[project.scripts]
parousia-guard = "parousia.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/multi_agent_mem0_test.py"
