[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parousia-guard"
version = "0.2.0"
description = "Agentic Mail Server Guard — Postfix pipe-to-agent gateway with rate limiting and temporal presence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MR-Krabs", email = "team@pairadmin.dev"}]
dependencies = [
    "click>=8.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "redis>=5.0",
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "icalendar>=5.0",
    "python-dateutil>=2.8",
    "dkimpy>=1.1.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
    "fakeredis>=2.20",
    "httpx>=0.27.0",
]
postgres = [
    "psycopg2-binary>=2.9",
]

[project.scripts]
parousia-guard = "parousia.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
