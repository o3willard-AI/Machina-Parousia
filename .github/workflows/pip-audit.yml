name: pip-audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version: "3.12"
      - name: Install project and pip-audit (pinned)
        run: |
          pip install "pip-audit==2.10.1"
          pip install -e .
      - name: Audit dependencies
        run: pip-audit
